workflow:
  rules:
    # Run on pushes to master (staging flow: tag + deploy together).
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    # Run on final release tags only (production deploy only, no tag step).
    # RC tags intentionally excluded — they are internal artifacts, not release triggers.
    - if: '$CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_TAG !~ /-rc/'

stages:
  - tag
  - deploy

# Triggers on any push to master (i.e., after a MR is merged).
create-rc-tag:
  stage: tag
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    # CI_ACCESS_TOKEN must be a GitLab Project Access Token with write_repository scope,
    # stored as a protected/masked CI variable.
    - git remote set-url origin "https://oauth2:${CI_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/bump-version.sh

deploy-staging:
  stage: deploy
  image: python:3.11
  needs: [create-rc-tag]
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - pip install git+https://github.com/Itential/asyncplatform.git
    - python scripts/deploy.py Staging
  variables:
    HOST: $PLATFORM_HOST
    CLIENT_ID: $PLATFORM_CLIENT_ID
    CLIENT_SECRET: $PLATFORM_CLIENT_SECRET
    PROJECT_MEMBERS: $PROJECT_MEMBERS

deploy-production:
  stage: deploy
  image: python:3.11
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_TAG !~ /-rc/'
  script:
    - pip install git+https://github.com/Itential/asyncplatform.git
    - python scripts/deploy.py Production
  variables:
    HOST: $PLATFORM_HOST
    CLIENT_ID: $PLATFORM_CLIENT_ID
    CLIENT_SECRET: $PLATFORM_CLIENT_SECRET
    PROJECT_MEMBERS: $PROJECT_MEMBERS
